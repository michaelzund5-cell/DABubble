<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>DABubble</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eceefe">
</head>
<body>
  <!-- Angular renders the whole app inside this element -->
  <app-root></app-root>
</body>
</html>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Die einzige echte HTML-Seite der App (Single Page Application).
  - lang="de": Sprache der Seite, wichtig für Screenreader.
  - base href="/": Grundpfad für das Routing.
  - viewport: Sorgt dafür, dass die Seite auf dem Handy richtig skaliert.
  - <app-root>: Hier setzt Angular die gesamte App ein. Seitenwechsel
    laden keine neue HTML-Datei, Angular tauscht nur den Inhalt aus.
-->

<nav class="sidebar" aria-label="Devspace">
  <app-search-box class="mobile mobile-search" placeholder="Gehe zu..." />

  <div class="devspace">
    <img class="devspace-logo" src="img/devspace.png" alt="">
    <h2>Devspace</h2>
    <button class="icon-btn edit" type="button" (click)="state.openNewMessage()" aria-label="Neue Nachricht">
      <img src="img/icons/edit-square.svg" alt="">
    </button>
  </div>

  <section class="group">
    <div class="group-head">
      <button class="toggle" type="button" (click)="channelsOpen.set(!channelsOpen())"
        [class.closed]="!channelsOpen()" [attr.aria-expanded]="channelsOpen()">
        <img class="caret" src="img/icons/arrow-drop-down.svg" alt="">
        <img src="img/icons/workspaces.svg" alt="">
        <span>Channels</span>
      </button>
      <button class="icon-btn add" type="button" (click)="state.openDialog('createChannel')" aria-label="Channel erstellen">
        <img class="desktop-icon" src="img/icons/add.svg" alt="">
        <img class="mobile-icon" src="img/icons/add-purple.svg" alt="">
      </button>
    </div>

    @if (channelsOpen()) {
      <ul class="channels">
        @for (channel of channelService.myChannels(); track channel.id) {
          <li>
            <button class="channel" type="button" [class.active]="isActive('channel', channel.id)"
              (click)="open('channel', channel.id)">
              <img [src]="isActive('channel', channel.id) ? 'img/icons/tag-active.svg' : 'img/icons/tag.svg'" alt="">
              {{ channel.name }}
            </button>
          </li>
        }
        <li>
          <button class="channel add-channel" type="button" (click)="state.openDialog('createChannel')">
            <img class="desktop-icon" src="img/icons/add-circle.svg" alt="">
            <img class="mobile-icon" src="img/icons/add-circle-purple.svg" alt="">
            Channel hinzufügen
          </button>
        </li>
      </ul>
    }
  </section>

  <section class="group">
    <div class="group-head">
      <button class="toggle" type="button" (click)="directOpen.set(!directOpen())"
        [class.closed]="!directOpen()" [attr.aria-expanded]="directOpen()">
        <img class="caret" src="img/icons/arrow-drop-down.svg" alt="">
        <img src="img/icons/account-circle.svg" alt="">
        <span>Direktnachrichten</span>
      </button>
    </div>

    @if (directOpen()) {
      <ul class="people">
        @for (user of userService.users(); track user.id) {
          <li>
            <button class="person" type="button" [class.active]="isActive('direct', user.id)"
              (click)="open('direct', user.id)">
              <app-avatar [user]="user" [size]="50" [showStatus]="true" />
              {{ user.name }}{{ user.id === userService.currentUser()?.id ? ' (Du)' : '' }}
            </button>
          </li>
        }
      </ul>
    }
  </section>

  <button class="new-message-fab" type="button" (click)="state.openNewMessage()" aria-label="Neue Nachricht">
    <img src="img/icons/edit-white.svg" alt="">
  </button>
</nav>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Sidebar "Devspace" (Figma Seite 17).
  - Stift-Icon: öffnet "Neue Nachricht" (Block 6).
  - Channels und Direktnachrichten lassen sich mit dem Pfeil
    einklappen (channelsOpen / directOpen).
  - Aktiver Channel: helle Pille und blaues #-Icon (Figma).
  - "+" und "Channel hinzufügen": öffnen das Fenster "Channel erstellen".
  - Handy (Figma Seite 44): oben das Suchfeld "Gehe zu...", das Stift-
    Icon wird zum runden Button unten rechts (new-message-fab), "+" und
    "Channel hinzufügen" sind lila.
  - Direktnachrichten: alle Personen inkl. dir selbst mit "(Du)",
    wie in Figma. Der Online-Punkt kommt aus dem Avatar.

<header class="header">
  @if (showBack()) {
    <button class="back" type="button" (click)="state.mobileBack()" aria-label="Zurück zum Menü">
      <img src="img/icons/arrow-left.svg" alt="">
    </button>
    <img class="devspace-logo" src="img/devspace.png" alt="">
    <span class="devspace">Devspace</span>
  } @else {
    <picture class="logo">
      <source media="(max-width: 999px)" srcset="img/logo-mobile.svg">
      <img src="img/logo.svg" alt="DABubble">
    </picture>
  }

  <app-search-box class="search" />

  @if (userService.currentUser(); as user) {
    <button class="profile" type="button" (click)="state.openDialog('headerMenu')"
      [attr.aria-expanded]="state.dialog() === 'headerMenu'" aria-label="Profilmenü">
      <span class="name">{{ user.name }}</span>
      <app-avatar [user]="user" [size]="viewport.isMobile() ? 50 : 70" [showStatus]="!viewport.isMobile()" />
      <img class="arrow" src="img/icons/arrow-down.svg" alt="">
    </button>

    @if (state.dialog() === 'headerMenu') {
      <app-dialog [placement]="viewport.isMobile() ? 'bottom' : 'top-right'" [dim]="viewport.isMobile()"
        label="Profilmenü" (closed)="state.closeDialog()">
        <div class="menu">
          <span class="handle" aria-hidden="true"></span>
          <button type="button" (click)="state.openProfile(user.id)">
            <img class="menu-icon" src="img/icons/account-circle.svg" alt="">Profil
          </button>
          <button type="button" (click)="logout()">
            <img class="menu-icon" src="img/icons/logout.svg" alt="">Log out
          </button>
        </div>
      </app-dialog>
    }
  }
</header>

<form class="composer" (ngSubmit)="send()">
  <textarea #field name="text" [(ngModel)]="text" (ngModelChange)="onTextChange()" (keydown)="onKeydown($event)"
    [placeholder]="placeholder()" aria-label="Nachricht schreiben" [maxlength]="maxLength"></textarea>

  <div class="toolbar">
    <button #emojiBtn class="icon-btn" type="button" (click)="togglePicker(emojiBtn)" aria-label="Emoji einfügen">
      <img src="img/icons/emoji.svg" alt="">
    </button>
    <button class="icon-btn" type="button" (click)="startMention(); field.focus()" aria-label="Person erwähnen">
      <img src="img/icons/mention.svg" alt="">
    </button>
    <button class="icon-btn send" type="submit" [disabled]="!text.trim() || !hasTarget()" aria-label="Senden">
      <img src="img/icons/send-message.svg" alt="">
    </button>
  </div>

  @if (pickerAnchor(); as anchor) {
    <app-popover [anchor]="anchor" label="Emoji einfügen" (closed)="pickerAnchor.set(null)">
      <app-emoji-picker (picked)="insertEmoji($event); field.focus()" />
    </app-popover>
  }
  @if (trigger(); as currentTrigger) {
    <app-mention-list class="popup" [trigger]="currentTrigger" [query]="query()"
      (pickedUser)="insertMention($event.name); field.focus()"
      (pickedChannel)="insertMention($event.name); field.focus()" />
  }
</form>

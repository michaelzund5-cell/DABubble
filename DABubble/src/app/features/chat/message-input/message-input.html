<form class="composer" (ngSubmit)="send()">
  <textarea #field name="text" [(ngModel)]="text" (ngModelChange)="onTextChange()" (keydown)="onKeydown($event)"
    [placeholder]="placeholder()" aria-label="Nachricht schreiben" [maxlength]="maxLength"></textarea>

  <div class="toolbar">
    <button class="icon-btn" type="button" (click)="pickerOpen.set(!pickerOpen())" aria-label="Emoji einfügen">
      <img src="img/icons/emoji.svg" alt="">
    </button>
    <button class="icon-btn" type="button" (click)="startMention(); field.focus()" aria-label="Person erwähnen">
      <img src="img/icons/mention.svg" alt="">
    </button>
    <button class="icon-btn send" type="submit" [disabled]="!text.trim() || !hasTarget()" aria-label="Senden">
      <img src="img/icons/send-message.svg" alt="">
    </button>
  </div>

  @if (pickerOpen()) {
    <app-emoji-picker class="popup" (picked)="insertEmoji($event); field.focus()" />
  }
  @if (trigger(); as currentTrigger) {
    <app-mention-list class="popup" [trigger]="currentTrigger" [query]="query()"
      (pickedUser)="insertMention($event.name); field.focus()"
      (pickedChannel)="insertMention($event.name); field.focus()" />
  }
</form>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Eingabefeld für Nachrichten (Figma Seite 17) und Thread-Antworten.
  - (ngModelChange): nach jeder Eingabe prüfen, ob @ oder # getippt wurde.
  - Smiley: Emoji-Auswahl, das Zeichen kommt in den Text.
  - @-Icon: fügt ein @ ein und öffnet die Personenliste.
  - Bei @ oder # öffnet die Liste über dem Feld, Klick setzt den Namen ein.
  - field.focus(): Nach einem Klick auf Emoji, @ oder einen Namen springt
    der Cursor zurück ins Feld. Sonst hätte der Button den Fokus und
    Enter würde nicht senden.
  - Senden ist gesperrt, solange das Feld leer ist.
-->

<section class="thread-card" aria-labelledby="thread-title">
  <header class="thread-header">
    <h2 id="thread-title">Thread</h2>
    <span class="location">{{ location() }}</span>
    <button class="close" type="button" (click)="state.closeThread()" aria-label="Thread schließen">
      <img src="img/icons/close.svg" alt="">
    </button>
  </header>

  @if (rootMessage(); as root) {
    <div class="messages">
      <app-message-item [message]="root" [compact]="true" [showThreadInfo]="false" />

      <div class="replies-divider">
        <span>{{ replies().length }} {{ replies().length === 1 ? 'Antwort' : 'Antworten' }}</span>
      </div>

      @for (reply of replies(); track reply.id) {
        <app-message-item [message]="reply" [compact]="true" [showThreadInfo]="false" />
      }
    </div>

    <app-message-input [threadId]="root.id" />
  }
</section>

<section class="chat" [class.with-thread]="!!state.openThreadId()">
  <header class="chat-header" [class.person-header]="!!partner()">
    @if (channel(); as current) {
      <button class="title" type="button" (click)="state.openDialog('channelDetails')" aria-label="Channel-Details">
        <img class="desktop-icon" src="img/icons/tag-header.svg" alt="">
        <img class="mobile-icon" src="img/icons/tag-mobile.svg" alt="">
        <span>{{ current.name }}</span>
        <img class="desktop-icon" src="img/icons/arrow-down-header.svg" alt="">
        <img class="mobile-icon" src="img/icons/arrow-down-mobile.svg" alt="">
      </button>

      <div class="members">
        <button class="avatars" type="button" (click)="state.openDialog('members')" aria-label="Mitglieder anzeigen">
          @for (member of visibleMembers(); track member.id) {
            <app-avatar [user]="member" [size]="40" />
          }
          <span class="count">{{ members().length }}</span>
        </button>
        <button class="add-member" type="button" (click)="state.openDialog('addMembers')"
          aria-label="Mitglieder hinzufügen">
          <img class="desktop-icon" src="img/icons/person-add.svg" alt="">
          <img class="mobile-icon" src="img/icons/person-add-mobile.svg" alt="">
        </button>
      </div>
    } @else if (partner(); as person) {
      <button class="title person" type="button" (click)="state.openProfile(person.id)" aria-label="Profil anzeigen">
        <app-avatar [user]="person" [size]="50" [showStatus]="true" />
        <span>{{ person.name }}{{ isSelf() ? ' (Du)' : '' }}</span>
      </button>
    }
  </header>

  <div class="messages" #list>
    @for (group of days(); track group.day) {
      <div class="day-divider"><span>{{ group.day | chatDate }}</span></div>
      @for (message of group.messages; track message.id) {
        <app-message-item [message]="message" (openThread)="state.openThread($event)" />
      }
    } @empty {
      <app-chat-intro [channel]="channel()" [partner]="partner()" [isSelf]="isSelf()" />
    }
  </div>

  <app-message-input [narrow]="!!state.openThreadId()" />
</section>

<main class="auth-page">
  <div class="brand"><span class="logo">DB</span><strong>DABubble</strong></div>

  <section class="card" aria-labelledby="reset-title">
    <p class="eyebrow">Zugang wiederherstellen</p>
    <h1 id="reset-title">Passwort zurücksetzen</h1>
    <p class="intro">Gib deine E-Mail-Adresse ein. Wir senden dir einen Link zum Zurücksetzen.</p>

    <form (ngSubmit)="requestReset()">
      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="name@beispiel.ch" autocomplete="email">

      @if (message) {
        <p role="status">{{ message }}</p>
      }

      <button class="btn-primary" type="submit">Link anfordern</button>
    </form>

    <p class="switch-link"><a routerLink="/login">Zurück zur Anmeldung</a></p>
  </section>
</main>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Das HTML der Passwort-Seite: ein Feld für die E-Mail und ein Button.
  Die Meldung erscheint nur, wenn es eine gibt (@if). role="status"
  lässt Screenreader die Meldung vorlesen, ohne den Benutzer zu
  unterbrechen.
-->

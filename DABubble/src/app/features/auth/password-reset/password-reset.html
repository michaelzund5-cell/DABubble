<main class="auth-page">
  <picture class="logo">
    <source media="(max-width: 999px)" srcset="img/logo-auth-mobile.svg">
    <img src="img/logo.svg" alt="DABubble">
  </picture>

  <section class="card" aria-labelledby="reset-title">
    <a class="back-btn" routerLink="/login" aria-label="Zurück zur Anmeldung">
      <img src="img/icons/arrow-back.svg" alt="">
    </a>
    <h1 id="reset-title">Passwort zurücksetzen</h1>
    <p class="intro">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

    <form (ngSubmit)="send()" novalidate>
      <div class="field">
        <img src="img/icons/mail.svg" alt="">
        <input name="email" type="email" [(ngModel)]="email" (blur)="emailTouched = true"
          placeholder="beispielname@email.com" autocomplete="email" aria-label="E-Mail-Adresse">
        @if (emailTouched && getEmailError()) {
          <p class="field-error" role="alert">{{ getEmailError() }}</p>
        }
      </div>

      <p class="hint">Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</p>

      <button class="btn-primary send" type="submit" [disabled]="!!getEmailError() || sent()">E-Mail senden</button>
    </form>
  </section>

  <nav class="legal-links">
    <a class="link" routerLink="/imprint">Impressum</a>
    <a class="link" routerLink="/privacy">Datenschutz</a>
  </nav>

  @if (sent()) {
    <app-toast text="E-Mail gesendet" icon="img/icons/send.svg" />
  }
</main>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Seite "Passwort zurücksetzen", Schritt 1 (Figma Seite 5).
  - Zurück-Pfeil: führt zur Anmeldung (routerLink, ohne Neuladen).
  - novalidate: schaltet die Browser-Fehlerblasen aus. Wir zeigen eigene
    Fehlertexte unter dem Feld (Vorgabe der Checkliste).
  - (blur)="emailTouched = true": Der Fehler erscheint erst, wenn das
    Feld einmal verlassen wurde. Sonst wäre er schon beim Öffnen rot.
  - [disabled]: Der Button bleibt grau, bis die E-Mail gültig ist, und
    nach dem Senden, damit nicht doppelt gesendet wird.
  - !!getEmailError(): macht aus dem Text ein true/false.
  - @if (sent()): zeigt die Bubble "E-Mail gesendet" mit Icon.
-->

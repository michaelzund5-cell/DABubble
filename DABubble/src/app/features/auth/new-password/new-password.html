<main class="auth-page">
  <picture class="logo">
    <source media="(max-width: 999px)" srcset="img/logo-auth-mobile.svg">
    <img src="img/logo.svg" alt="DABubble">
  </picture>

  <section class="card" aria-labelledby="new-password-title">
    <a class="back-btn" routerLink="/login" aria-label="Zurück zur Anmeldung">
      <img src="img/icons/arrow-back.svg" alt="">
    </a>
    <h1 id="new-password-title">Passwort zurücksetzen</h1>

    <form (ngSubmit)="save()" novalidate>
      <div class="field">
        <input name="password" type="password" [(ngModel)]="password" (blur)="touched.password = true"
          placeholder="Neues Passwort" autocomplete="new-password" aria-label="Neues Passwort">
        @if (touched.password && getPasswordError()) {
          <p class="field-error" role="alert">{{ getPasswordError() }}</p>
        }
      </div>

      <div class="field">
        <input name="repeat" type="password" [(ngModel)]="repeat" (blur)="touched.repeat = true"
          placeholder="Neues Kennwort bestätigen" autocomplete="new-password" aria-label="Neues Kennwort bestätigen">
        @if (touched.repeat && getRepeatError()) {
          <p class="field-error" role="alert">{{ getRepeatError() }}</p>
        }
      </div>

      <button class="btn-primary save" type="submit" [disabled]="!isValid() || saving()">Passwort ändern</button>
    </form>
  </section>

  <nav class="legal-links">
    <a class="link" routerLink="/imprint">Impressum</a>
    <a class="link" routerLink="/privacy">Datenschutz</a>
  </nav>
</main>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Seite "Passwort zurücksetzen", Schritt 2 (Figma Seite 6).
  Der Benutzer kommt über den Link aus der E-Mail hierher.
  - Zwei Felder ohne Icon, wie in Figma.
  - Fehler erscheinen erst nach dem Verlassen des Feldes (touched).
  - autocomplete="new-password": Der Browser schlägt ein neues, starkes
    Passwort vor, statt das alte einzusetzen.
  - Button gesperrt, bis beide Felder gültig sind und übereinstimmen,
    und während gespeichert wird (saving), damit nicht doppelt gesendet.
-->

<main class="auth-page">
  <picture class="logo">
    <source media="(max-width: 999px)" srcset="img/logo-auth-mobile.svg">
    <img src="img/logo.svg" alt="DABubble">
  </picture>

  <section class="card" aria-labelledby="avatar-title">
    <button class="back-btn" type="button" (click)="back()" [disabled]="busy()" aria-label="Zurück zur Registrierung">
      <img src="img/icons/arrow-back.svg" alt="">
    </button>
    <h1 id="avatar-title">Wähle deinen Avatar</h1>

    <img class="preview" [src]="selected() ?? defaultAvatar" alt="Ausgewählter Avatar">
    <p class="user-name">{{ userName }}</p>
    <p class="choose-label">Aus der Liste wählen</p>

    <div class="avatar-list" role="radiogroup" aria-label="Avatar auswählen">
      @for (avatar of avatars; track avatar; let i = $index) {
        <button class="avatar-option" type="button" role="radio" [class.selected]="avatar === selected()"
          [attr.aria-checked]="avatar === selected()" [attr.aria-label]="'Avatar ' + (i + 1)" (click)="select(avatar)">
          <img [src]="avatar" alt="">
        </button>
      }
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <button class="btn-primary next" type="button" [disabled]="!selected() || busy()" (click)="finish()">Weiter</button>
  </section>

  <nav class="legal-links">
    <a class="link" routerLink="/imprint">Impressum</a>
    <a class="link" routerLink="/privacy">Datenschutz</a>
  </nav>

  @if (finished()) {
    <app-toast text="Konto erfolgreich erstellt!" />
  }
</main>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Avatar-Auswahl (Figma Seite 4).
  - [src]="selected() ?? defaultAvatar": Zeigt den gewählten Avatar, sonst
    den Platzhalter (?? = "wenn null, dann").
  - @for ... track avatar: Schleife über alle Avatare. track hilft Angular,
    die Liste effizient neu zu zeichnen.
  - role="radiogroup" / role="radio" / aria-checked: Screenreader erkennen
    die Avatare als Auswahl mit genau einer Option.
-->

<div class="toast" role="status">
  @if (icon()) {
    <img [src]="icon()" alt="">
  }
  <span>{{ text() }}</span>
</div>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Bubble-Hinweis, z. B. "Konto erfolgreich erstellt!".
  - @if (icon()): Das Bild erscheint nur, wenn ein Icon übergeben wird
    (z. B. bei "E-Mail gesendet").
  - role="status": Screenreader lesen den Text automatisch vor.
-->

<button class="backdrop" type="button" tabindex="-1" aria-label="Schließen" (click)="closed.emit()"></button>
<div #card class="card" role="dialog" [attr.aria-label]="label()" [class.ready]="position()"
  [style.top.px]="position()?.top" [style.left.px]="position()?.left">
  <ng-content />
</div>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Popup-Rahmen.
  - .backdrop: unsichtbarer Button über der ganzen Seite. Ein Klick
    daneben trifft ihn und schliesst das Popup. tabindex="-1": Mit der
    Tab-Taste springt man nicht auf ihn.
  - .card: der Inhalt (ng-content), zum Beispiel die Emoji-Auswahl.
    top und left kommen aus place() in popover.ts.
-->

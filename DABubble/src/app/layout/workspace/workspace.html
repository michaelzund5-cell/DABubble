<div class="workspace">
  <app-header />

  <main class="content" [class.collapsed]="!sidebarOpen()" [class.with-thread]="!!state.openThreadId()"
    [class.mobile-chat]="state.mobileChatOpen()">
    <aside class="sidebar-column" [attr.aria-hidden]="!sidebarOpen()">
      <app-sidebar />
    </aside>

    <section class="chat-column">
      @if (state.activeView().type === 'new') {
        <app-new-message />
      } @else {
        <app-channel-view />
      }
    </section>

    @if (state.openThreadId()) {
      <aside class="thread-column"><app-thread-panel /></aside>
    }
  </main>

  @switch (state.dialog()) {
    @case ('profile') { <app-profile-dialog /> }
    @case ('ownProfile') { <app-profile-dialog /> }
    @case ('channelDetails') { <app-channel-details /> }
    @case ('members') { <app-members-dialog /> }
    @case ('addMembers') { <app-add-members-dialog /> }
    @case ('createChannel') { <app-create-channel-dialog /> }
  }

  <button class="menu-toggle" type="button" [class.collapsed]="!sidebarOpen()" (click)="sidebarOpen.set(!sidebarOpen())"
    [attr.aria-expanded]="sidebarOpen()">
    <img [src]="sidebarOpen() ? 'img/icons/menu-close.svg' : 'img/icons/menu-open.svg'" alt="">
    <span>{{ sidebarOpen() ? 'Workspace-Menü schließen' : 'Workspace-Menu öffnen' }}</span>
  </button>
</div>

<!--
  =====================================================================
  ZUSAMMENFASSUNG (Deutsch)
  =====================================================================
  Seitenrahmen nach dem Login (Figma Seiten 17 und 18).
  - Header oben, darunter drei Spalten: Sidebar, Chat, optional Thread.
  - Mittlere Spalte: Chat oder "Neue Nachricht" (Figma Seite 20).
  - [class.collapsed]: Sidebar ist eingeklappt, der Chat wird breiter.
  - Button am linken Rand: klappt die Sidebar ein und aus (User Story 5).
    Der Text lautet in Figma "Workspace-Menü schließen" bzw.
    "Workspace-Menu öffnen" (ohne ü, 1:1 übernommen).
  - @switch (state.dialog()): zeigt das offene Fenster (Profil, Channel-
    Details, Mitglieder, Leute hinzufügen, Channel erstellen). Das Menü
    oben rechts liegt im Header.
  - mobile-chat: Auf dem Handy ist immer nur eine Ansicht sichtbar: Menü,
    Chat oder Thread (CSS in workspace.scss, User Story 5).
  - aria-hidden: Eingeklappte Sidebar wird von Screenreadern ignoriert.
-->
